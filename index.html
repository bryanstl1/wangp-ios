<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WanGP iOS · diagnóstico WebGPU</title><style>body{font:16px system-ui;background:#0c1020;color:#f4f6ff;max-width:640px;margin:auto;padding:24px}button{font:inherit;background:#b2a3ff;color:#101020;border:0;border-radius:12px;padding:14px 20px;font-weight:700}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#20263b;padding:18px;border-radius:12px}small{color:#aab2ca}h1{font-size:26px}</style></head><body><h1>WanGP · Safari GPU Lab</h1><p>Prueba local de WebGPU en iPhone. <strong>No ejecuta el modelo Wan ni genera video.</strong></p><button id="run">Probar GPU</button> <button id="copy">Copiar resultados</button><pre id="out">Listo para iniciar.</pre><small>Requiere Safari compatible y contexto seguro (HTTPS). No se transmiten resultados.</small><script>
const out=document.getElementById('out');let report='';function log(s){report+=s+'\n';out.textContent=report}document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(report)}catch(e){log('No se pudo copiar: '+e.message)}};
document.getElementById('run').onclick=async()=>{report='';let device;try{log('Contexto seguro: '+isSecureContext);log('WebGPU disponible: '+Boolean(navigator.gpu));if(!navigator.gpu)throw Error('Safari no expone navigator.gpu');const adapter=await navigator.gpu.requestAdapter({powerPreference:'high-performance'});if(!adapter)throw Error('No se obtuvo adaptador WebGPU');log('Adaptador obtenido');log('Límite de buffer: '+adapter.limits.maxBufferSize+' bytes');log('Límite de almacenamiento: '+adapter.limits.maxStorageBufferBindingSize+' bytes');device=await adapter.requestDevice();const n=65536;const input=new Float32Array(n);for(let i=0;i<n;i++)input[i]=i%251;const bytes=input.byteLength;const src=device.createBuffer({size:bytes,usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_DST});const dst=device.createBuffer({size:bytes,usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_SRC});const read=device.createBuffer({size:bytes,usage:GPUBufferUsage.COPY_DST|GPUBufferUsage.MAP_READ});device.queue.writeBuffer(src,0,input);const shader=device.createShaderModule({code:`@group(0) @binding(0) var<storage,read> a:array<f32>; @group(0) @binding(1) var<storage,read_write> b:array<f32>; @compute @workgroup_size(64) fn main(@builtin(global_invocation_id) id:vec3<u32>){let i=id.x;if(i<65536u){b[i]=a[i]*2.0+1.0;}}`});const pipeline=device.createComputePipeline({layout:'auto',compute:{module:shader,entryPoint:'main'}});const bind=device.createBindGroup({layout:pipeline.getBindGroupLayout(0),entries:[{binding:0,resource:{buffer:src}},{binding:1,resource:{buffer:dst}}]});const encoder=device.createCommandEncoder();const pass=encoder.beginComputePass();pass.setPipeline(pipeline);pass.setBindGroup(0,bind);pass.dispatchWorkgroups(Math.ceil(n/64));pass.end();encoder.copyBufferToBuffer(dst,0,read,0,bytes);const start=performance.now();device.queue.submit([encoder.finish()]);await read.mapAsync(GPUMapMode.READ);const result=new Float32Array(read.getMappedRange());let failures=0;for(let i=0;i<n;i++)if(Math.abs(result[i]-(input[i]*2+1))>0.001)failures++;const elapsed=(performance.now()-start).toFixed(1);log('Cálculo: '+n+' valores en '+elapsed+' ms (incluye transferencia y sincronización)');log('Errores de verificación: '+failures);log(failures===0?'RESULTADO: GPU COMPUTE FUNCIONAL':'RESULTADO: FALLÓ LA VERIFICACIÓN');read.unmap();src.destroy();dst.destroy();read.destroy()}catch(e){log('ERROR: '+(e?.message||e))}finally{device?.destroy()}};
</script></body></html>
