<!doctype html><html><meta charset="utf-8"><title>Automated GPU reference test</title><script type="module">
import {GpuRuntime} from '../src/gpu.js';import {runWanBlock} from '../src/wan-block.js';import {compare,quantize,dequantize,linearCPU} from '../src/math.js';
window.checkGPU=async()=>{const gpu=await GpuRuntime.create();try{const got=await gpu.linear(new Float32Array([1,2,3,4]),new Float32Array([1,0,0,1,2,3]),new Float32Array([1,2,3]),2,2,3);const simple=compare(got,[2,4,11,4,6,21]);if(!simple.passed)throw Error('Linear mismatch');const f=await(await fetch('./fixtures/block-reference.json')).json();const provider={get:async n=>new Float32Array(f.weights[n].data),read:async(n,{elementOffset=0,count})=>new Float32Array(f.weights[n].data.slice(elementOffset,elementOffset+count))};const y=await runWanBlock({config:f.config,grid:f.config.grid,provider,gpu,x:new Float32Array(f.inputs.x.data),context:new Float32Array(f.inputs.context.data),e:new Float32Array(f.inputs.e.data)});const full=compare(y,f.output.data,2e-5,2e-4);if(!full.passed)throw Error(JSON.stringify(full));const quantized={};for(const bits of [4,8]){const x=new Float32Array([1,2,3,4]),weights=new Float32Array([.1,-.7,.3,1.1,-.4,.2]),bias=new Float32Array([.1,.2,.3]);const q=quantize(weights,bits,3);const got=await gpu.linearQuantized(x,q,bias,2,2,3);const check=compare(got,linearCPU(x,dequantize(q),bias,2,2,3),2e-5,2e-5);if(!check.passed)throw Error('Packed INT'+bits+' mismatch');quantized[bits]=check;}const cancel=new AbortController();const pending=gpu.linear(new Float32Array([1,2]),new Float32Array([1,0]),new Float32Array([0]),1,2,1,cancel.signal);cancel.abort();let cancelled=false;try{await pending;}catch(e){cancelled=e.name==='AbortError';}if(!cancelled||gpu.liveBuffers!==0)throw Error('Cancelled operation leaked buffers');const limits=gpu.limits;gpu.device.destroy();await gpu.device.lost;let lossHandled=false;try{await gpu.linear(new Float32Array([1]),new Float32Array([1]),new Float32Array([0]),1,1,1);}catch{lossHandled=true;}if(!lossHandled)throw Error('Device loss not reported');return {simple,full,quantized,cancelled,lossHandled,limits,liveBuffers:gpu.liveBuffers};}finally{gpu.destroy();}};
</script></html>
